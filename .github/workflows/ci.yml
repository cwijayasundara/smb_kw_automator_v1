# The same checks a contributor runs locally (see Makefile), on every push and pull request.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGPASSWORD: postgres

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - name: Roles and databases
        run: psql -h localhost -U postgres -f backend/scripts/init-db.sql
      - run: uv sync --extra ocr --extra observability --locked
        working-directory: backend
      - name: Lint
        working-directory: backend
        run: uv run ruff check keel tests migrations ../packages/model-router && uv run ruff format --check keel tests migrations ../packages/model-router
      - name: Typecheck
        working-directory: backend
        run: uv run mypy keel ../packages/model-router/src
      - name: Tests (real Postgres, RLS-bound app role)
        working-directory: backend
        run: uv run pytest -q tests ../packages/model-router/tests
      - name: Build independent model router wheel
        run: uv build --directory packages/model-router --out-dir /tmp/router-dist
      - name: Parser bake-off on the synthetic gold set (no value may be invented)
        working-directory: backend
        run: |
          uv run keel evals synthetic --out /tmp/gold && git diff --exit-code --no-index evals/gold/synthetic /tmp/gold
          uv run keel evals parsers --engines local-rules --gold evals/gold/synthetic --out /tmp/evals \
            --min-accuracy 0.95 --max-invented 0

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: psql -h localhost -U postgres -f backend/scripts/init-db.sql
      - run: uv sync --extra ocr --extra observability --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generated API client matches the backend
        run: make openapi && git diff --exit-code -- openapi.json frontend/lib/api/gen
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - name: Start the stack
        run: |
          (cd backend && uv run keel migrate)
          (cd backend && nohup uv run keel api > ../api.log 2>&1 &)
          (cd backend && nohup uv run keel worker > ../worker.log 2>&1 &)
          (cd frontend && nohup pnpm start > ../web.log 2>&1 &)
          timeout 90 bash -c 'until curl -sf localhost:8000/api/healthz && curl -sf -o /dev/null localhost:3000/login; do sleep 1; done'
      - run: pnpm exec playwright test
        working-directory: frontend
      - name: Page state at failure
        if: failure()
        run: find frontend/test-results -name error-context.md -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
      - name: Server logs
        if: failure()
        run: grep -v '" 200 OK' api.log | tail -n 80; tail -n 40 worker.log web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: frontend/test-results, retention-days: 7 }
