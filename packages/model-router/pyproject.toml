[project]
name = "harness-model-router"
version = "0.1.0"
description = "Capability-aware, cost-first model selection for agent harnesses"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11"]

[project.optional-dependencies]
langchain = ["langchain>=1.4,<2", "langgraph>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_model_router"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

