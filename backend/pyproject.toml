[project]
name = "keel"
version = "0.1.0"
description = "Keel backend: tenant management, document intelligence and agents for small food producers"
requires-python = ">=3.13,<3.14"
dependencies = [
  "harness-model-router[langchain]",
  "pyyaml>=6.0.2",
  "fastapi>=0.120",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.40",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.15",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.20",
  "pypdfium2>=4.30",
  "pillow>=11",
  "rapidfuzz>=3.10",
  "fpdf2>=2.8",
  "structlog>=24.4",
  "httpx>=0.28",
  "email-validator>=2.2",
  "deepagents>=0.7.21,<0.8",
  "langchain>=1.4",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.1",
  "langchain-openai>=1.6",
  "langchain-google-genai>=4.4",
  "langchain-fireworks>=1.7",
  "google-auth[requests]>=2.40",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.20"]
observability = [
    "langfuse>=3",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.15", "asgi-lifespan>=2.1", "types-pyyaml>=6"]

[project.scripts]
keel = "keel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harness-model-router = { path = "../packages/model-router" }

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "S105", "S106", "B008", "RUF001", "RUF002", "RUF003", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["llm: needs real model API keys (skipped by default)"]
